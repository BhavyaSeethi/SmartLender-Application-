<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loan Approval Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: "Times New Roman", serif;
        }

        /* Top Green Heading */

        .header {
            width: 100%;
            background-color: #7d9134;
            color: black;
            font-size: 18px;
            font-weight: bold;
            padding: 8px 15px;
        }

        /* Main Form */

        .form-container {
            width: 100%;
            background-color: #f5f5f5;
            padding: 10px 15px;
        }

        /* Each Field */

        .field {
            width: 100%;
            margin-bottom: 10px;
        }

        .field label {
            display: block;
            width: 100%;
            background-color: #eeeeee;
            color: #555555;
            font-size: 15px;
            font-weight: bold;
            padding: 7px;
            border: 1px solid #dddddd;
        }

        .field input,
        .field select {
            display: block;
            width: 100%;
            height: 38px;
            background-color: white;
            border: 1px solid #dddddd;
            padding: 8px;
            font-family: "Times New Roman", serif;
            font-size: 14px;
        }

        /* Submit Area */

        .submit-area {
            width: 100%;
            background-color: #eeeeee;
            border: 1px solid #dddddd;
            padding: 12px;
        }

        .submit-button {
            background-color: #16b879;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #0da369;
        }

        /* Bottom Green Area */

        .footer {
            width: 100%;
            height: 45px;
            background-color: #7d9134;
        }

    </style>
</head>

<body>

    <!-- Heading -->

    <div class="header">
        Enter your Details for Loan Approval Prediction
    </div>


    <!-- Form -->

    <div class="form-container">

        <!-- Gender -->

        <div class="field">
            <label>Gender</label>

            <select>
                <option>Male</option>
                <option>Female</option>
            </select>
        </div>


        <!-- Marital -->

        <div class="field">
            <label>Marital</label>

            <select>
                <option>Yes</option>
                <option>No</option>
            </select>
        </div>


        <!-- Dependents -->

        <div class="field">
            <label>Dependents</label>

            <input
                type="number"
                placeholder="No. of Dependents eg. 0, 1, 2..."
            >
        </div>


        <!-- Education -->

        <div class="field">
            <label>Education</label>

            <select>
                <option>Graduate</option>
                <option>Not Graduate</option>
            </select>
        </div>


        <!-- Self Employed -->

        <div class="field">
            <label>Self Employed</label>

            <select>
                <option>Yes</option>
                <option>No</option>
            </select>
        </div>


        <!-- Applicant Income -->

        <div class="field">
            <label>Applicant Income</label>

            <input
                type="number"
                placeholder="Your Income..."
            >
        </div>


        <!-- Co Applicant Income -->

        <div class="field">
            <label>Co-Applicant Income</label>

            <input
                type="number"
                placeholder="Your Co-Applicant Income..."
            >
        </div>


        <!-- Loan Amount -->

        <div class="field">
            <label>Loan Amount</label>

            <input
                type="number"
                placeholder="Enter the Loan Amount..."
            >
        </div>


        <!-- Loan Amount Term -->

        <div class="field">
            <label>Loan Amount Term</label>

            <input
                type="number"
                placeholder="Enter the Term Loan-Amount in days..."
            >
        </div>


        <!-- Credit History -->

        <div class="field">
            <label>Credit History</label>

            <input
                type="text"
                placeholder="Enter the Your Previous Credit History..."
            >
        </div>


        <!-- Property Area -->

        <div class="field">
            <label>Property Area</label>

            <select>
                <option>Urban</option>
                <option>Semiurban</option>
                <option>Rural</option>
            </select>
        </div>


        <!-- Submit Button -->

        <div class="submit-area">

            <button
                class="submit-button"
                onclick="submitForm()">
                Submit
            </button>

        </div>

    </div>


    <!-- Bottom Green -->

    <div class="footer"></div>


    <script>

        function submitForm() {

            alert("Loan prediction submitted successfully!");

        }

    </script>

</body>
  </html>
